name: Notify Docs

on:
  push:
    branches: [main]
    # Must stay in sync with the `paths=(...)` array in the "Compute diff
    # and changed paths" step below.
    paths:
      - "crates/execution/metering/**"
      - "crates/execution/txpool-rpc/**"
      - "crates/execution/flashblocks/**"
      - "crates/consensus/rpc/**"
      - "crates/proof/rpc/**"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Override BASE_SHA for the diff. Leave blank for HEAD^."
        required: false
        type: string
        default: ""
      target_sha:
        description: "Override AFTER_SHA for the diff. Leave blank for HEAD."
        required: false
        type: string
        default: ""

# Serialize runs but never cancel an in-flight one: each push's dispatch
# covers only its own before..after range, so cancelling a run would lose
# that range's docs sync permanently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCS_REPOSITORY: soheimam/nodes-docs
  # Threshold above which the diff travels as a GitHub Actions artifact
  # instead of inline in the dispatch. Compared against the size of the
  # fully-encoded dispatch payload — the thing GitHub actually limits
  # (~64 KB ceiling on client_payload, including JSON escaping and the
  # PR title/body riding alongside the diff) — not the raw diff bytes.
  # 60 KB leaves real headroom under that ceiling; artifact transport
  # makes a conservative threshold nearly free.
  PAYLOAD_SIZE_LIMIT: 61440
  # Code-change dispatches use this event_type. Release dispatches use a
  # different one and are fired from docs-pr-dispatch-release.yml.
  EVENT_TYPE: base-code-changed
  # The "effective" source SHA — what the receiver should treat as the
  # commit that drove this dispatch. On a real push to main this is just
  # github.sha. On a workflow_dispatch replay it's the `target_sha` input,
  # so the receiver's branch name + PR title + provenance links all
  # reference the diff content rather than whatever happened to be at
  # base/main HEAD when we replayed the dispatch. Without this, every
  # replay collapses onto the same branch (`docs/sync-code-change-<HEAD>`)
  # and the second run silently overwrites the first run's PR.
  EFFECTIVE_SHA: ${{ github.event.inputs.target_sha || github.sha }}
  # Artifact carrying the diff when the payload is oversized. Keyed off the
  # run id (always unique) rather than github.sha — two replays of the same
  # target_sha must not collide on artifact storage; the receiver pulls by
  # diff_artifact_run_id + diff_artifact_name.
  DIFF_ARTIFACT_NAME: sync-diff-${{ github.run_id }}

jobs:
  notify:
    name: Dispatch contract change to docs repo
    # Fork guard: do not run on forks of soheimam/base even if the workflow file
    # is copied. The dispatch step holds a cross-repo PAT, so refusing to run
    # outside the canonical repo is the cheapest form of containment.
    if: github.repository == 'soheimam/base'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Authorize trigger
        # Defense in depth: push-to-main already requires write access via branch
        # protection, but we explicitly verify the pusher (github.actor) has at
        # least write permission via the REST collaborators endpoint. Fails the
        # job before any cross-repo network call happens if the actor doesn't
        # qualify. workflow_dispatch is gated the same way.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # No --fail-with-body: the endpoint 404s for identities that are not
          # collaborators (e.g. bot/app actors), and that body parses to
          # permission "none" — a clean, intentional refusal below rather than
          # a raw curl error. API errors also parse to "none" (fail closed).
          perm=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/collaborators/${ACTOR}/permission" \
            | jq -r '.permission // "none"')
          case "$perm" in
            admin|maintain|write)
              echo "Actor '$ACTOR' has '$perm' permission on $REPO."
              ;;
            *)
              echo "Actor '$ACTOR' has '$perm' permission on $REPO — refusing to dispatch." >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # 0 = full history. Needed so historical SHAs passed via
          # workflow_dispatch inputs (demo replays) are reachable. For normal
          # pushes 2 is enough, but the cost of full fetch is a few seconds
          # and the simplicity is worth it.
          fetch-depth: 0

      - name: Compute diff and changed paths
        id: diff
        env:
          # When fired via workflow_dispatch with explicit inputs we honor those
          # (used for demo replays where we want to dispatch a historical diff).
          # On real pushes both inputs are absent → fall through to the event's
          # before/after SHAs.
          BEFORE_SHA: ${{ github.event.inputs.base_sha || github.event.before }}
          AFTER_SHA: ${{ github.event.inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail

          # Must stay in sync with the push trigger's `paths:` filter above.
          paths=(
            "crates/execution/metering"
            "crates/execution/txpool-rpc"
            "crates/execution/flashblocks"
            "crates/consensus/rpc"
            "crates/proof/rpc"
          )

          diff_file="$RUNNER_TEMP/node-methods.diff"
          changed_paths_file="$RUNNER_TEMP/changed-paths.json"

          # Three cases for $BEFORE_SHA:
          #   1. Normal push: a real parent SHA → diff against it.
          #   2. Initial push to a branch: all-zeros sentinel → use HEAD^.
          #   3. workflow_dispatch: empty (event has no `before` field) → use HEAD^.
          # Cases 2 and 3 collapse to the same fallback.
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="${AFTER_SHA}^"
          else
            base="$BEFORE_SHA"
          fi

          # Full unified diff for the watched paths.
          git diff "$base" "$AFTER_SHA" -- "${paths[@]}" > "$diff_file"

          # List of changed file paths (relative to repo root). The docs-side
          # router uses these to decide which doc pages to regenerate.
          git diff "$base" "$AFTER_SHA" --name-only -- "${paths[@]}" \
            | jq -R -s 'split("\n") | map(select(length > 0))' > "$changed_paths_file"

          echo "diff_path=$diff_file" >> "$GITHUB_OUTPUT"
          echo "changed_paths_path=$changed_paths_file" >> "$GITHUB_OUTPUT"
          echo "Computed diff: $(wc -c < "$diff_file") bytes across ${#paths[@]} watched paths"
          echo "Changed files: $(jq 'length' "$changed_paths_file")"

          # Possible on workflow_dispatch replays whose SHA range touches no
          # watched path (push events are protected by the `paths:` filter).
          # Skip the dispatch rather than spinning up the receiver's full
          # pipeline to do nothing.
          if [[ $(jq 'length' "$changed_paths_file") -eq 0 ]]; then
            echo "::notice::No watched-path changes in ${base}..${AFTER_SHA}; skipping dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve associated pull request
        if: steps.diff.outputs.skip != 'true'
        id: pr
        env:
          # Use the auto-injected workflow token; no gh CLI, no third-party tooling.
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Look up the PR for the SHA the diff actually lands at — on a
          # workflow_dispatch replay this is target_sha, not the dispatcher
          # run's HEAD. Otherwise the PR title/body in the docs PR come from
          # the wrong upstream PR.
          SHA: ${{ env.EFFECTIVE_SHA }}
        run: |
          set -euo pipefail

          # The endpoint returns every PR associated with the commit, merged
          # or not; prefer the merged one so the docs PR cites the PR that
          # actually landed this change.
          pr_json=$(curl -sS --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}/pulls" \
            | jq '[.[] | select(.merged_at != null)][0] // .[0] // {}')

          number=$(jq -r '.number // ""' <<< "$pr_json")
          title=$(jq -r '.title // ""' <<< "$pr_json")
          body=$(jq -r '.body // ""' <<< "$pr_json")

          echo "number=$number" >> "$GITHUB_OUTPUT"
          printf '%s' "$title" > "$RUNNER_TEMP/pr_title.txt"
          printf '%s' "$body" > "$RUNNER_TEMP/pr_body.txt"

          if [[ -n "$number" ]]; then
            echo "Resolved PR #$number: $title"
          else
            echo "No PR associated with this commit (direct push to main); dispatching with empty PR context."
          fi

      - name: Build dispatch payload
        if: steps.diff.outputs.skip != 'true'
        id: payload
        env:
          DIFF_PATH: ${{ steps.diff.outputs.diff_path }}
          CHANGED_PATHS_PATH: ${{ steps.diff.outputs.changed_paths_path }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Effective source SHA — see comment on EFFECTIVE_SHA above. The
          # receiver derives branch name, PR title, and provenance from
          # this; using github.sha here collapses every replay into one PR.
          SHA: ${{ env.EFFECTIVE_SHA }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          payload_file="$RUNNER_TEMP/dispatch.json"

          # The payload shape is identical for both transports; only the
          # diff-carrying fields differ:
          #   * inline:    `diff` carries the full diff content
          #   * artifact:  `diff` is empty, diff_artifact_* fields point at
          #                the GitHub Actions artifact uploaded on THIS run
          build_payload() {
            jq -n \
              --arg event_type "$EVENT_TYPE" \
              --arg sha "$SHA" \
              --arg pr_number "$PR_NUMBER" \
              --rawfile pr_title "$RUNNER_TEMP/pr_title.txt" \
              --rawfile pr_body "$RUNNER_TEMP/pr_body.txt" \
              --slurpfile changed_paths "$CHANGED_PATHS_PATH" \
              "$@" \
              '{
                event_type: $event_type,
                client_payload: {
                  kind: "code-change",
                  sha: $sha,
                  pr_number: $pr_number,
                  pr_title: $pr_title,
                  pr_body: $pr_body,
                  diff: $diff,
                  diff_artifact_run_id: $diff_artifact_run_id,
                  diff_artifact_name: $diff_artifact_name,
                  changed_paths: $changed_paths[0]
                }
              }' > "$payload_file"
          }

          # Build inline first (fast path, no artifact round-trip), then
          # measure what we would actually send. GitHub's limit applies to
          # the encoded payload — diff + PR context + JSON escaping — so
          # that is what the threshold must be compared against, not the
          # raw diff size.
          build_payload \
            --rawfile diff "$DIFF_PATH" \
            --arg diff_artifact_run_id "" \
            --arg diff_artifact_name ""
          payload_size=$(wc -c < "$payload_file" | tr -d ' ')

          if (( payload_size > PAYLOAD_SIZE_LIMIT )); then
            echo "Inline payload is $payload_size bytes (> $PAYLOAD_SIZE_LIMIT); switching to artifact transport."
            build_payload \
              --arg diff "" \
              --arg diff_artifact_run_id "$RUN_ID" \
              --arg diff_artifact_name "$DIFF_ARTIFACT_NAME"
            echo "use_artifact=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_artifact=false" >> "$GITHUB_OUTPUT"
          fi

          echo "payload_path=$payload_file" >> "$GITHUB_OUTPUT"
          echo "Payload size: $(wc -c < "$payload_file") bytes"

      - name: Upload diff artifact (only for oversized payloads)
        if: steps.payload.outputs.use_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIFF_ARTIFACT_NAME }}
          path: ${{ steps.diff.outputs.diff_path }}
          retention-days: 7
          if-no-files-found: error

      - name: Send repository_dispatch to docs repo
        if: steps.diff.outputs.skip != 'true'
        env:
          DOCS_PAT: ${{ secrets.DOCS_REPO_TOKEN }}
          PAYLOAD_PATH: ${{ steps.payload.outputs.payload_path }}
          # Notice banner + log line should show the SHA the receiver will
          # actually document, not whatever happened to be at base/main HEAD.
          SHA: ${{ env.EFFECTIVE_SHA }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCS_PAT:-}" ]]; then
            echo "DOCS_REPO_TOKEN secret is not configured." >&2
            exit 1
          fi

          response_body="$RUNNER_TEMP/response.txt"
          status_code=$(curl -sS \
            -o "$response_body" \
            -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCS_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DOCS_REPOSITORY/dispatches" \
            --data-binary @"$PAYLOAD_PATH")

          echo "Dispatch status: $status_code"
          if [[ -s "$response_body" ]]; then
            echo "Response body:"
            cat "$response_body"
          fi

          if [[ "$status_code" != "204" ]]; then
            echo "Dispatch failed (expected 204, got $status_code)." >&2
            exit 1
          fi

          echo "Dispatched '$EVENT_TYPE' to $DOCS_REPOSITORY for ${SHA}"
          # `::notice::` surfaces this as a banner in the run summary,
          # rather than being buried in the step log. Same primitive
          # Mintlify uses via core.notice() in their automate-agent example.
          echo "::notice title=Docs dispatch sent::${EVENT_TYPE} → ${DOCS_REPOSITORY} (base@${SHA:0:7})"
